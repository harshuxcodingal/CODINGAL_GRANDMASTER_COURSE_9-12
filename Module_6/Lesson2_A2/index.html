<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@300;400;500;600;700&family=Roboto+Slab:wght@400;700&display=swap"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Projects Section -->
    <section id="projects" class="container py-5">

        <h1 class="text-center text-warning mb-5">
            My Projects
        </h1>

        <div class="row">

            <!-- Card 1 -->
            <div class="col-md-4 mb-4">
                <div class="card h-100">

                    <img src="https://picsum.photos/300/200?random=1"
                         class="card-img-top"
                         alt="Project 1">

                    <div class="card-body">

                        <h5 class="card-title">
                            Portfolio Website
                        </h5>

                        <p class="card-text">
                            A responsive portfolio website built using
                            HTML, CSS, Bootstrap, and JavaScript.
                        </p>

                        <button class="btn btn-warning">
                            View Project
                        </button>

                    </div>

                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-md-4 mb-4">
                <div class="card h-100">

                    <img src="https://picsum.photos/300/200?random=2"
                         class="card-img-top"
                         alt="Project 2">

                    <div class="card-body">

                        <h5 class="card-title">
                            Calculator App
                        </h5>

                        <p class="card-text">
                            A simple calculator using JavaScript
                            with arithmetic operations.
                        </p>

                        <button class="btn btn-warning">
                            View Project
                        </button>

                    </div>

                </div>
            </div>

            <!-- Card 3 -->
            <div class="col-md-4 mb-4">
                <div class="card h-100">

                    <img src="https://picsum.photos/300/200?random=3"
                         class="card-img-top"
                         alt="Project 3">

                    <div class="card-body">

                        <h5 class="card-title">
                            Student Management System
                        </h5>

                        <p class="card-text">
                            A project to manage student details and
                            academic records efficiently.
                        </p>

                        <button class="btn btn-warning">
                            View Project
                        </button>

                    </div>

                </div>
            </div>

        </div>

    </section>

</body>
</html>
