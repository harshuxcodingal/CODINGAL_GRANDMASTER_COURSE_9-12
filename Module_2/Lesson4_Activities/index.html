<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Explorers Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🚀 Space Explorers Club</h1>

        <p>
            Welcome to the Space Explorers Club! Join us on an exciting
            journey through the universe.
        </p>

        <!-- Hover and Active -->
        <button class="join-btn">
            Join Mission
        </button>

        <br><br>

        <!-- Focus -->
        <input type="text" placeholder="Enter Astronaut Name">

        <br><br>

        <!-- Disabled -->
        <button disabled>
            Registration Closed
        </button>

    </div>

</body>
</html>
