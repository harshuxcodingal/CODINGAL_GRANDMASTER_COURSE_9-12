<!DOCTYPE html>
<html>

<head>
    <title>Structure of HTML</title>
    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: #2c3e50;
            font-size: 40px;
        }

        h2 {
            color: #16a085;
        }

        p {
            font-size: 20px;
            color: #555;
        }

        button {
            background-color: #16a085;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #13856b;
        }
    </style>
</head>

<body>
    <h1>Hi... Harshal this side from Codingal 👋</h1>
    <h2>Welcome to My First Web Page 🌐</h2>
    <p>HTML stands for HyperText Markup Language</p>
    <p>I am learning Web Development 🚀</p>

    <button>Click Me!</button>
</body>

</html>
